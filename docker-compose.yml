name: localtube

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localtube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-localtube}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-localtube}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-localtube}
      MEDIA_ROOT: /media
      DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-1}
      DEFAULT_MAX_HEIGHT: ${DEFAULT_MAX_HEIGHT:-360}
      PROFILES_ROOT: /config/profiles
      BROWSER_URL: http://browser:9000
    volumes:
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/media
      - localtube-config:/config
    depends_on:
      postgres:
        condition: service_healthy

  # Chromium for signing profiles in to YouTube. Only reachable through Caddy at /browser/,
  # and only by the profile that is signing in. Chromium itself runs only during a sign-in.
  browser:
    build: ./apps/browser
    restart: unless-stopped
    shm_size: 1gb
    environment:
      PUID: ${BROWSER_PUID:-1000}
      PGID: ${BROWSER_PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - localtube-config:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
      - web
      - browser

volumes:
  pgdata:
  caddy-data:
  localtube-config:
